<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#008f39">
  <title>GLS-OS | Grupo Litoral Seg</title>

  <!-- Fontes (mesmas do site principal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#008f39',
              dark: '#006025',
              light: '#e8f5e9'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen font-sans antialiased">

  <!-- TELA 1: Carregando -->
  <div id="screen-loading" class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="w-14 h-14 rounded-2xl bg-primary text-white flex items-center justify-center text-2xl shadow-lg mb-4">
      <i class="fa-solid fa-clipboard-list"></i>
    </div>
    <p class="text-sm text-gray-500 font-medium">Carregando GLS-OS...</p>
  </div>

  <!-- TELA 2: Login (Mobile-First) -->
  <div id="screen-login" class="hidden min-h-screen flex flex-col justify-between p-5 max-w-md mx-auto">
    <div class="pt-4">
      <a href="../" class="inline-flex items-center gap-2 text-xs text-gray-500 hover:text-primary transition">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao site Grupo Litoral Seg
      </a>
    </div>

    <div class="my-auto py-8">
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-2xl bg-primary text-white mx-auto flex items-center justify-center text-3xl shadow-lg mb-3">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="font-heading text-2xl font-bold text-gray-900">
          GLS-<span class="text-primary">OS</span>
        </h1>
        <p class="text-sm text-gray-500 mt-1">Gestão de Ordens de Serviço</p>
      </div>

      <form id="login-form" class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm space-y-4">
        <div id="login-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl p-3"></div>

        <div>
          <label for="email" class="block text-xs font-semibold text-gray-700 mb-1.5">E-mail corporativo</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input
              type="email"
              id="email"
              required
              autocomplete="email"
              placeholder="tecnico@grupolitoralseg.com.br"
              class="w-full pl-10 pr-3.5 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
            />
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-gray-700 mb-1.5">Senha</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input
              type="password"
              id="password"
              required
              autocomplete="current-password"
              placeholder="••••••••"
              class="w-full pl-10 pr-3.5 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"
            />
          </div>
        </div>

        <button
          id="login-btn"
          type="submit"
          class="w-full bg-primary hover:bg-primary-dark text-white font-semibold py-3 rounded-xl text-sm shadow-sm transition active:scale-[0.98]"
        >
          <i class="fa-solid fa-right-to-bracket mr-2"></i>Entrar
        </button>
      </form>
    </div>

    <footer class="text-center text-xs text-gray-400 pb-2">
      © 2026 Grupo Litoral Seg · Uso interno
    </footer>
  </div>

  <!-- TELA 3: Aplicação Principal -->
  <div id="screen-app" class="hidden min-h-screen flex flex-col pb-20">
    <!-- Header fixo -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
      <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-primary text-white flex items-center justify-center text-base">
            <i class="fa-solid fa-clipboard-list"></i>
          </div>
          <div>
            <div class="font-heading font-bold text-base leading-tight">
              GLS-<span class="text-primary">OS</span>
            </div>
            <div class="text-[11px] text-gray-500 leading-tight">
              <span id="user-email"></span> · <span id="user-role" class="text-primary font-medium"></span>
            </div>
          </div>
        </div>
        <button id="btn-logout" title="Sair" class="text-gray-400 hover:text-red-600 p-2 rounded-lg transition">
          <i class="fa-solid fa-right-from-bracket text-base"></i>
        </button>
      </div>
    </header>

    <!-- Conteúdo da aba ativa -->
    <main id="tab-content" class="flex-1 max-w-lg w-full mx-auto px-4 py-5"></main>

    <!-- Barra de navegação inferior (Mobile-First) -->
    <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 z-30">
      <div class="max-w-lg mx-auto grid grid-cols-3">
        <button data-tab="os" class="flex flex-col items-center py-2.5 text-primary font-semibold text-xs gap-1">
          <i class="fa-solid fa-list-check text-lg"></i>
          <span>Ordens</span>
        </button>
        <button data-tab="nova" class="flex flex-col items-center py-2.5 text-gray-400 text-xs gap-1">
          <i class="fa-solid fa-circle-plus text-lg"></i>
          <span>Nova OS</span>
        </button>
        <button data-tab="perfil" class="flex flex-col items-center py-2.5 text-gray-400 text-xs gap-1">
          <i class="fa-solid fa-user text-lg"></i>
          <span>Perfil</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- App Logic -->
  <script type="module" src="./js/app.js"></script>
</body>

</html>
